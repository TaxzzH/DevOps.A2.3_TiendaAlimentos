version: '3.8'
services:
  frontend:
    image: tomashduocuc/petstore-frontend:latest
    ports:
      - "3000:80"
    restart: always
    depends_on:
      - backend
  backend:
    image: tomashduocuc/petstore-backend:latest
    ports:
      - "3001:3001" 
    restart: always
    depends_on:
      - db
  db:
    image: tomashduocuc/petstore-db
    ports:
      - "3307:3307"
    restart: always