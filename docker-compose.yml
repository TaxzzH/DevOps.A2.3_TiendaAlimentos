version: '3.8'
services:
  frontend:
    image: tomashduocuc/petstore-frontend:latest
    ports:
      - "3000:80"
    restart: always
    depends_on:
      - backend
  backend:
    image: tomashduocuc/petstore-backend:latest
    ports:
      - "3001:3001" 
    restart: always
    depends_on:
      - db
  db:
    image: mysql:8.0 
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password_seguro
      MYSQL_DATABASE: petstore_db
    restart: always